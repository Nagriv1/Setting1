name: Build single EXE
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'global.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: service1-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.201'
      - name: Test and publish
        shell: pwsh
        run: |
          dotnet restore tests/Tests.csproj --configfile NuGet.Config
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish src/Service1.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:RuntimeFrameworkVersion=10.0.12 -p:DebugType=None --source https://api.nuget.org/v3/index.json -o release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $hash=(Get-FileHash release/Service1.exe -Algorithm SHA256).Hash
          Set-Content release/SHA256SUMS.txt "$hash  Service1.exe" -Encoding ascii
          Copy-Item distribution/Install-Service1.ps1 release/Install-Service1.ps1
      - name: Publish versioned download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v1.0.1-single'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; choose a new tag to preserve verified downloads.' }
          gh release create $tag release/Service1.exe release/SHA256SUMS.txt release/Install-Service1.ps1 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Service1 single EXE — unsigned preview' --notes-file distribution/RELEASE-NOTES.md --prerelease
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
